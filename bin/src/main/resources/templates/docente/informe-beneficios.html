<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saber Pro UTS')}">
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Informe Beneficios | Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/saberpro.css}" rel="stylesheet"/>
</head>
<body class="sp-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="sp-main">
<div th:replace="~{fragments/layout :: topbar}"></div>
<main class="sp-content">
    <div class="sp-page-header">
        <div>
            <h1 class="sp-page-title font-display"><i class="bi bi-award-fill me-2"></i>Informe de Beneficios</h1>
            <p class="sp-page-subtitle">Consulta de alumnos beneficiados — solo lectura</p>
        </div>
    </div>
    <div class="sp-card">
        <div class="sp-card-header">
            <h5><i class="bi bi-people-fill me-2"></i>Alumnos con Beneficio Asignado</h5>
            <span class="badge sp-badge-count"
                  th:text="${#lists.size(alumnosConBeneficio)} + ' alumnos'">0</span>
        </div>
        <div class="sp-card-body p-0">
            <div class="table-responsive">
                <table class="table sp-table mb-0">
                    <thead>
                        <tr><th>Alumno</th><th>Cédula</th><th>Facultad</th><th>Tipo Beneficio</th><th>Puntaje</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${alumnosConBeneficio}">
                            <td style="font-weight:600" th:text="${a.nombreCompleto}">-</td>
                            <td th:text="${a.cedula}">-</td>
                            <td th:text="${a.facultadNombre}">-</td>
                            <td><span class="badge bg-success" th:text="${a.tipoBeneficio}">-</span></td>
                            <td>
                                <span th:if="${a.resultadoUnico != null}" style="font-weight:700;color:var(--sp-navy)"
                                      th:text="${a.resultadoUnico.puntajeGlobal}">-</span>
                                <span th:unless="${a.resultadoUnico != null}" class="text-muted">N/A</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(alumnosConBeneficio)}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox me-2"></i>Sin alumnos con beneficio
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="sp-card mt-4">
        <div class="sp-card-header">
            <h5><i class="bi bi-file-earmark-text-fill me-2"></i>Resoluciones Vigentes</h5>
        </div>
        <div class="sp-card-body p-0">
            <div class="table-responsive">
                <table class="table sp-table mb-0">
                    <thead><tr><th>N° Resolución</th><th>Título</th><th>Área</th><th>Tipo</th><th>Puntaje Mín.</th></tr></thead>
                    <tbody>
                        <tr th:each="r : ${resoluciones}">
                            <td style="font-family:monospace;font-weight:600" th:text="${r.numeroResolucion}">-</td>
                            <td th:text="${r.titulo}">-</td>
                            <td><span class="badge sp-badge-area" th:text="${r.area}">-</span></td>
                            <td th:text="${r.tipoBeneficio}">-</td>
                            <td th:text="${r.puntajeMinimo}">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</div>


<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
