<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saber Pro UTS')}">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Resoluciones de Beneficios | Saber Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/saberpro.css}" rel="stylesheet"/>
</head>
<body class="sp-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="sp-main">
<div th:replace="~{fragments/layout :: topbar}"></div>
<main class="sp-content">

    <div class="sp-page-header">
        <div>
            <h1 class="sp-page-title font-display">
                <i class="bi bi-file-earmark-text-fill me-2"></i>Resoluciones de Beneficios
            </h1>
            <p class="sp-page-subtitle">Tecnología e Ingeniería — Gestión de resoluciones de beneficios Saber Pro</p>
        </div>
        <button class="btn sp-btn-primary" data-bs-toggle="modal" data-bs-target="#modalResolucion"
                onclick="limpiarFormulario()">
            <i class="bi bi-plus-circle-fill me-2"></i>Nueva Resolución
        </button>
    </div>

    <div th:if="${mensaje}" class="alert sp-alert"
         th:classappend="'alert-' + ${tipoMensaje}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla resoluciones -->
    <div class="sp-card">
        <div class="sp-card-header">
            <h5><i class="bi bi-table me-2"></i>Resoluciones Registradas</h5>
            <span class="badge sp-badge-count"
                  th:text="${#lists.size(resoluciones)} + ' resoluciones'">0</span>
        </div>
        <div class="sp-card-body p-0">
            <div class="table-responsive">
                <table class="table sp-table mb-0">
                    <thead>
                        <tr>
                            <th>N° Resolución</th>
                            <th>Título</th>
                            <th>Área</th>
                            <th>Tipo Beneficio</th>
                            <th>Puntaje Mín.</th>
                            <th>Fecha Emisión</th>
                            <th>Vigencia</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${resoluciones}">
                            <td>
                                <span style="font-family:monospace;font-weight:600;color:var(--sp-navy)"
                                      th:text="${r.numeroResolucion}">-</span>
                            </td>
                            <td th:text="${r.titulo}">-</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${r.area == 'TECNOLOGIA' ?
                                                       ' ' : r.area == 'INGENIERIA' ?
                                                       ' ' : ' '}"
                                      style="background:rgba(10,36,99,0.08);color:var(--sp-navy)"
                                      th:text="${r.area}">-</span>
                            </td>
                            <td th:text="${r.tipoBeneficio}">-</td>
                            <td th:text="${r.puntajeMinimo}">-</td>
                            <td th:text="${r.fechaEmision}">-</td>
                            <td th:text="${r.fechaVigencia}">-</td>
                            <td>
                                <span th:if="${r.vigente}" class="badge bg-success">Vigente</span>
                                <span th:unless="${r.vigente}" class="badge bg-secondary">Vencida</span>
                            </td>
                            <td class="text-center">
                                <div class="sp-action-btns">
                                    <a th:href="@{/admin/resoluciones/editar/{id}(id=${r.id})}"
                                       class="btn sp-btn-icon sp-btn-edit" title="Editar">
                                        <i class="bi bi-pencil-fill"></i>
                                    </a>
                                    <a th:href="@{/admin/resoluciones/eliminar/{id}(id=${r.id})}"
                                       class="btn sp-btn-icon sp-btn-delete" title="Desactivar"
                                       data-confirm="¿Desactivar esta resolución?">
                                        <i class="bi bi-trash-fill"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(resoluciones)}">
                            <td colspan="9" class="text-center py-4 text-muted">
                                <i class="bi bi-file-earmark me-2 fs-4"></i><br/>
                                No hay resoluciones registradas
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalResolucion" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content sp-modal">
                <div class="modal-header sp-modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-file-earmark-text-fill me-2"></i>
                        <span th:text="${resolucion.id != null ? 'Editar Resolución' : 'Nueva Resolución'}">Resolución</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form th:action="@{/admin/resoluciones/guardar}" th:object="${resolucion}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="sp-form-label">N° Resolución *</label>
                                <input type="text" th:field="*{numeroResolucion}"
                                       class="form-control sp-form-control"
                                       placeholder="Ej: RES-2024-001" required/>
                            </div>
                            <div class="col-md-8">
                                <label class="sp-form-label">Título *</label>
                                <input type="text" th:field="*{titulo}"
                                       class="form-control sp-form-control"
                                       placeholder="Título de la resolución" required/>
                            </div>
                            <div class="col-12">
                                <label class="sp-form-label">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control sp-form-control"
                                          rows="2" placeholder="Descripción general de la resolución..."></textarea>
                            </div>
                            <div class="col-md-4">
                                <label class="sp-form-label">Área *</label>
                                <select th:field="*{area}" class="form-select sp-form-control" required>
                                    <option value="">— Seleccionar —</option>
                                    <option value="TECNOLOGIA">Tecnología</option>
                                    <option value="INGENIERIA">Ingeniería</option>
                                    <option value="AMBAS">Ambas</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="sp-form-label">Tipo de Beneficio *</label>
                                <select th:field="*{tipoBeneficio}" class="form-select sp-form-control" required>
                                    <option value="">— Seleccionar —</option>
                                    <option value="DESCUENTO_MATRICULA">Descuento Matrícula</option>
                                    <option value="BECA">Beca</option>
                                    <option value="RECONOCIMIENTO">Reconocimiento</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="sp-form-label">Puntaje Mínimo</label>
                                <input type="number" th:field="*{puntajeMinimo}"
                                       class="form-control sp-form-control"
                                       placeholder="Ej: 160" min="0" max="300"/>
                            </div>
                            <div class="col-md-4">
                                <label class="sp-form-label">% Descuento</label>
                                <input type="text" th:field="*{porcentajeDescuento}"
                                       class="form-control sp-form-control"
                                       placeholder="Ej: 25%"/>
                            </div>
                            <div class="col-md-4">
                                <label class="sp-form-label">Fecha de Emisión</label>
                                <input type="date" th:field="*{fechaEmision}"
                                       class="form-control sp-form-control"/>
                            </div>
                            <div class="col-md-4">
                                <label class="sp-form-label">Fecha de Vigencia</label>
                                <input type="date" th:field="*{fechaVigencia}"
                                       class="form-control sp-form-control"/>
                            </div>
                        </div>
                        <div class="d-flex gap-2 justify-content-end mt-4 pt-2 border-top">
                            <button type="button" class="btn sp-btn-outline" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn sp-btn-primary">
                                <i class="bi bi-save-fill me-2"></i>Guardar Resolución
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        if (/*[[${resolucion.id}]]*/ null) {
            new bootstrap.Modal(document.getElementById('modalResolucion')).show();
        }
    </script>

</main>
</div>


<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
