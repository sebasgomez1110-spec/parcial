<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saber Pro UTS')}">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alumnos por Facultad | Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/saberpro.css}" rel="stylesheet"/>
</head>
<body class="sp-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="sp-main">
<div th:replace="~{fragments/layout :: topbar}"></div>
<main class="sp-content">

    <div class="sp-page-header">
        <div>
            <h1 class="sp-page-title font-display">
                <i class="bi bi-building-fill me-2"></i>
                <span th:text="${facultad.nombre}">Facultad</span>
            </h1>
            <p class="sp-page-subtitle" th:text="'Código: ' + ${facultad.codigo} + ' — Alumnos inscritos en Saber Pro'">-</p>
        </div>
        <a th:href="@{/docente/dashboard}" class="btn sp-btn-outline">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </a>
    </div>

    <div class="sp-card">
        <div class="sp-card-header">
            <h5><i class="bi bi-table me-2"></i>Alumnos de la Facultad</h5>
            <span class="badge sp-badge-count"
                  th:text="${#lists.size(alumnos)} + ' alumnos'">0</span>
        </div>
        <div class="sp-card-body p-0">
            <div class="table-responsive">
                <table class="table sp-table mb-0">
                    <thead>
                        <tr>
                            <th>Alumno</th><th>Cédula</th><th>Programa</th>
                            <th>Semestre</th><th>Estado SP</th><th>Puntaje</th><th>Beneficio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${alumnos}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="sp-avatar sp-avatar-sm"><i class="bi bi-person-fill"></i></div>
                                    <span th:text="${a.nombreCompleto}">Nombre</span>
                                </div>
                            </td>
                            <td th:text="${a.cedula}">-</td>
                            <td th:text="${a.programaAcademico}">-</td>
                            <td th:text="${a.semestre}">-</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${a.estadoSaberPro == 'APROBADO' ? ' bg-success' :
                                                       a.estadoSaberPro == 'PENDIENTE' ? ' bg-warning text-dark' :
                                                       a.estadoSaberPro == 'RECHAZADO' ? ' bg-danger' : ' bg-secondary'}"
                                      th:text="${a.estadoSaberPro}">Estado</span>
                            </td>
                            <td>
                                <span th:if="${a.resultadoUnico != null}"
                                      style="font-weight:700"
                                      th:text="${a.resultadoUnico.puntajeGlobal}">-</span>
                                <span th:unless="${a.resultadoUnico != null}" class="text-muted">—</span>
                            </td>
                            <td>
                                <span th:if="${a.tieneBeneficio}" class="badge bg-success">
                                    <i class="bi bi-award me-1"></i>Sí
                                </span>
                                <span th:unless="${a.tieneBeneficio}" style="color:var(--c-text2);font-size:12px">No</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(alumnos)}">
                            <td colspan="7" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox me-2"></i>No hay alumnos en esta facultad
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
</div>


<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
