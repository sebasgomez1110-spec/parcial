<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saber Pro UTS')}">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Informe Alumnos | Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/saberpro.css}" rel="stylesheet"/>
</head>
<body class="sp-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="sp-main">
<div th:replace="~{fragments/layout :: topbar}"></div>
<main class="sp-content">

    <div class="sp-page-header" style="flex-wrap:wrap">
        <div>
            <h1 class="sp-page-title font-display"><i class="bi bi-bar-chart-fill me-2"></i>Informe de Alumnos</h1>
            <p class="sp-page-subtitle">Consulta de resultados Saber Pro</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/docente/informe/alumnos(tipo='TOTAL')}"
               class="btn" th:classappend="${tipo == 'TOTAL' ? ' sp-btn-primary' : ' sp-btn-outline'}">
                <i class="bi bi-people-fill me-1"></i>Total
            </a>
            <a th:href="@{/docente/informe/alumnos(tipo='UNICO')}"
               class="btn" th:classappend="${tipo == 'UNICO' ? ' sp-btn-primary' : ' sp-btn-outline'}">
                <i class="bi bi-person-fill me-1"></i>Único
            </a>
        </div>
        <div class="d-flex gap-2">
            <a href="/export/alumnos/print" target="_blank" class="btn sp-btn-outline btn-sm">
                <i class="bi bi-printer-fill me-1"></i>PDF / Imprimir
            </a>
            <a href="/export/alumnos/excel" class="btn sp-btn-primary btn-sm">
                <i class="bi bi-file-earmark-excel-fill me-1"></i>Descargar Excel
            </a>
        </div>
    </div>

    <!-- Métricas rápidas -->
    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="sp-metric-card sp-metric-blue">
                <div class="sp-metric-icon"><i class="bi bi-people-fill"></i></div>
                <div>
                    <div class="sp-metric-val" th:text="${totalAlumnos}">0</div>
                    <div class="sp-metric-lbl">Total</div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="sp-metric-card sp-metric-green">
                <div class="sp-metric-icon"><i class="bi bi-check-circle-fill"></i></div>
                <div>
                    <div class="sp-metric-val" th:text="${aprobados}">0</div>
                    <div class="sp-metric-lbl">Aprobados</div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="sp-metric-card sp-metric-purple">
                <div class="sp-metric-icon"><i class="bi bi-award-fill"></i></div>
                <div>
                    <div class="sp-metric-val" th:text="${conBeneficio}">0</div>
                    <div class="sp-metric-lbl">Beneficio</div>
                </div>
            </div>
        </div>
    </div>

    <div class="sp-card">
        <div class="sp-card-header">
            <h5>
                <i class="bi bi-table me-2"></i>
                <span th:text="${tipo == 'UNICO' ? 'Resultados Únicos' : 'Informe Total'}">Informe</span>
            </h5>
        </div>
        <div class="sp-card-body p-0">
            <div class="table-responsive">
                <table class="table sp-table mb-0">
                    <thead>
                        <tr>
                            <th>Nombre</th><th>Cédula</th><th>Facultad</th>
                            <th>Estado</th>
                            <th th:if="${tipo == 'UNICO'}">Puntaje Global</th>
                            <th th:if="${tipo == 'UNICO'}">Clasificación</th>
                            <th>Beneficio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${alumnos}">
                            <td style="font-weight:600" th:text="${a.nombreCompleto}">-</td>
                            <td th:text="${a.cedula}">-</td>
                            <td th:text="${a.facultadNombre}">-</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${a.estadoSaberPro == 'APROBADO' ? ' bg-success' :
                                                       a.estadoSaberPro == 'PENDIENTE' ? ' bg-warning text-dark' : ' bg-secondary'}"
                                      th:text="${a.estadoSaberPro}">-</span>
                            </td>
                            <td th:if="${tipo == 'UNICO'}">
                                <span th:if="${a.resultadoUnico != null}" style="font-weight:700;color:var(--sp-navy)"
                                      th:text="${a.resultadoUnico.puntajeGlobal}">-</span>
                                <span th:unless="${a.resultadoUnico != null}" class="text-muted">—</span>
                            </td>
                            <td th:if="${tipo == 'UNICO'}">
                                <span th:if="${a.resultadoUnico != null}" class="badge"
                                      th:classappend="${a.resultadoUnico.clasificacion == 'SUPERIOR' ? ' bg-success' :
                                                       a.resultadoUnico.clasificacion == 'ALTO' ? ' bg-primary' :
                                                       a.resultadoUnico.clasificacion == 'MEDIO' ? ' bg-warning text-dark' : ' bg-danger'}"
                                      th:text="${a.resultadoUnico.clasificacion}">-</span>
                            </td>
                            <td>
                                <span th:if="${a.tieneBeneficio}" class="badge bg-success">Sí</span>
                                <span th:unless="${a.tieneBeneficio}" class="text-muted">No</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
</div>


<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
