<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saber Pro UTS')}">
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Resoluciones | Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/saberpro.css}" rel="stylesheet"/>
</head>
<body class="sp-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="sp-main">
<div th:replace="~{fragments/layout :: topbar}"></div>
<main class="sp-content">
    <div class="sp-page-header">
        <div>
            <h1 class="sp-page-title font-display"><i class="bi bi-file-earmark-ruled-fill me-2"></i>Resoluciones de Beneficios</h1>
            <p class="sp-page-subtitle">Tecnología e Ingeniería — Solo consulta</p>
        </div>
    </div>

    <ul class="nav sp-tabs mb-4">
        <li class="nav-item">
            <button class="nav-link sp-tab active" data-bs-toggle="tab" data-bs-target="#tecnologia">
                <i class="bi bi-cpu me-1"></i>Tecnología
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link sp-tab" data-bs-toggle="tab" data-bs-target="#ingenieria">
                <i class="bi bi-gear-wide me-1"></i>Ingeniería
            </button>
        </li>
    </ul>
    <div class="tab-content">
        <div class="tab-pane fade show active" id="tecnologia">
            <div class="row g-4">
                <div th:each="r : ${resoluciones}" class="col-md-6">
                    <div class="sp-card">
                        <div class="sp-card-header">
                            <div>
                                <div style="font-family:monospace;font-size:12px;color:var(--c-text2)" th:text="${r.numeroResolucion}">N°</div>
                                <div style="font-weight:700;color:var(--sp-navy)" th:text="${r.titulo}">Título</div>
                            </div>
                            <span class="badge bg-success" style="font-size:10px">Vigente</span>
                        </div>
                        <div class="sp-card-body">
                            <div class="row g-2">
                                <div class="col-6">
                                    <div class="sp-data-field">
                                        <label>Tipo</label><p th:text="${r.tipoBeneficio}">-</p>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="sp-data-field">
                                        <label>Puntaje Mín.</label>
                                        <p style="font-weight:700;color:var(--sp-blue)"
                                           th:text="${r.puntajeMinimo}">-</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(resoluciones)}" class="col-12">
                    <div class="sp-empty-state">
                        <i class="bi bi-file-earmark-x"></i>
                        <p>No hay resoluciones vigentes para Tecnología</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="ingenieria">
            <div class="row g-4">
                <div th:each="r : ${resolucionesIngenieria}" class="col-md-6">
                    <div class="sp-card">
                        <div class="sp-card-header">
                            <div>
                                <div style="font-family:monospace;font-size:12px;color:var(--c-text2)" th:text="${r.numeroResolucion}">N°</div>
                                <div style="font-weight:700;color:var(--sp-navy)" th:text="${r.titulo}">Título</div>
                            </div>
                            <span class="badge bg-success" style="font-size:10px">Vigente</span>
                        </div>
                        <div class="sp-card-body">
                            <div class="row g-2">
                                <div class="col-6">
                                    <div class="sp-data-field">
                                        <label>Tipo</label><p th:text="${r.tipoBeneficio}">-</p>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="sp-data-field">
                                        <label>Puntaje Mín.</label>
                                        <p style="font-weight:700;color:var(--sp-blue)" th:text="${r.puntajeMinimo}">-</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(resolucionesIngenieria)}" class="col-12">
                    <div class="sp-empty-state">
                        <i class="bi bi-file-earmark-x"></i>
                        <p>No hay resoluciones vigentes para Ingeniería</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</div>


<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
